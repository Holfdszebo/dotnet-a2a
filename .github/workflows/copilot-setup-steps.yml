name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: copilot-obs
    permissions:
      contents: read
    steps:
      - name: Pre-install git-proxy (bypass Copilot's download)
        run: |
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          curl -fsSL http://172.31.197.37:8888/git-proxy -o "$RUNNER_TEMP/git-proxy"
          chmod +x "$RUNNER_TEMP/git-proxy"
          ls -la "$RUNNER_TEMP/git-proxy"

      - name: Proxy + CA (content-level observation)
        run: |
          curl -fsSL http://172.31.197.37:8888/mitm-ca.crt -o /home/runner/mitm-ca.crt
          openssl x509 -in /home/runner/mitm-ca.crt -noout -subject
          {
            echo "https_proxy=http://172.31.197.37:8080"
            echo "http_proxy=http://172.31.197.37:8080"
            echo "no_proxy=localhost,127.0.0.1,.actions.githubusercontent.com,release-assets.githubusercontent.com"
            echo "SSL_CERT_FILE=/home/runner/mitm-ca.crt"
            echo "CURL_CA_BUNDLE=/home/runner/mitm-ca.crt"
            echo "REQUESTS_CA_BUNDLE=/home/runner/mitm-ca.crt"
            echo "NODE_EXTRA_CA_CERTS=/home/runner/mitm-ca.crt"
          } >> "$GITHUB_ENV"
          git config --global http.sslCAInfo /home/runner/mitm-ca.crt

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET 9 (user-local)
        run: |
          # Keep "$HOME" form here to ensure zxq5 (paren) environment expansion stays covered.
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 9.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
