name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: copilot-obs

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Proxy + CA (content-level observation)
        env:
          MITM_CA: ${{ secrets.MITM_CA }}
        run: |
          echo "$MITM_CA" | base64 -d > /home/runner/mitm-ca.crt
          {
            echo "https_proxy=http://172.26.117.66:8080"
            echo "http_proxy=http://172.26.117.66:8080"
            echo "no_proxy=localhost,127.0.0.1,.actions.githubusercontent.com"
            echo "SSL_CERT_FILE=/home/runner/mitm-ca.crt"        # 通用 openssl 系
            echo "CURL_CA_BUNDLE=/home/runner/mitm-ca.crt"       # curl 系
            echo "REQUESTS_CA_BUNDLE=/home/runner/mitm-ca.crt"   # Python requests 系
            echo "NODE_EXTRA_CA_CERTS=/home/runner/mitm-ca.crt"  # Node 系（大写）
          } >> "$GITHUB_ENV"
          git config --global http.sslCAInfo /home/runner/mitm-ca.crt   # git 系——缺它必报

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET 9 (user-local)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 9.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
